# Russian language pack.
#
# Maps Russian surface phrases onto the SAME command ids as en.toml. The
# kernel never sees a word of this file's vocabulary -- it only ever learns
# that "this utterance is command `remind` with argument X".

code = "ru"
name = "Русский"
scripts = ["Cyrillic"]

# Openers that route to chitchat rather than to any capability.
greetings = ["привет", "здравствуй", "здравствуйте", "хай", "доброе утро", "добрый вечер"]

effect_claims = [
    "я поставил", "я поставила", "я запомнил", "я запомнила",
    "я удалил", "я удалила", "я сохранил", "я сохранила",
    "я создал", "я создала", "я отменил", "я отменила",
    "я отправил", "я отправила", "напоминание поставлено",
    "напоминание создано",
]

[commands]
time_now = ["который час", "сколько времени", "какое сегодня число", "время"]
self_meta = ["кто ты", "кто ты такой", "что ты такое", "расскажи о себе"]
help = ["помощь", "команды", "справка"]
list_reminders = ["мои напоминания", "напоминания", "список напоминаний"]
cancel_reminder = ["отмени напоминание", "отмена напоминания", "отменить напоминание"]
registry_list = ["мои факты", "факты", "список фактов", "реестр"]
invite = ["пригласи", "новый инвайт", "приглашение"]
telegram_code = ["код телеграм", "телеграм код", "телеграм"]

[[heads.remember]]
phrase = "запомни что"
skip = 2
[[heads.remember]]
phrase = "запомни"
skip = 1

[[heads.recall]]
phrase = "что ты помнишь о"
skip = 4
[[heads.recall]]
phrase = "что ты помнишь"
skip = 3
[[heads.recall]]
phrase = "вспомни"
skip = 1

[[heads.remind]]
phrase = "напомни мне"
skip = 2
[[heads.remind]]
phrase = "напомни"
skip = 1

[[heads.forget_fact]]
phrase = "забудь факт"
skip = 2

[[heads.correct_fact]]
phrase = "исправь факт"
skip = 2

[[heads.web_search]]
phrase = "найди в интернете"
skip = 3
[[heads.web_search]]
phrase = "поищи в интернете"
skip = 3
[[heads.web_search]]
phrase = "найди в сети"
skip = 3
[[heads.web_search]]
phrase = "погугли"
skip = 1
[[heads.web_search]]
phrase = "поищи"
skip = 1
[[heads.web_search]]
phrase = "найди"
skip = 1

[signals]
escalate_ultra = ["подумай изо всех сил", "максимум усилий"]
escalate_super = ["подумай как следует", "докажи", "по шагам", "теорема"]

[particles]
filler = ["что", "про", "о", "об"]
relative = ["через"]
absolute = ["в"]
tomorrow = ["завтра"]
minutes = ["минуту", "минуты", "минут", "мин"]
hours = ["час", "часа", "часов", "ч"]

[calendar]
weekdays = [
    "понедельник", "вторник", "среда", "четверг", "пятница", "суббота",
    "воскресенье",
]
weekdays_short = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"]
months = [
    "января", "февраля", "марта", "апреля", "мая", "июня",
    "июля", "августа", "сентября", "октября", "ноября", "декабря",
]
months_short = [
    "янв", "фев", "мар", "апр", "мая", "июн",
    "июл", "авг", "сен", "окт", "ноя", "дек",
]

[formats]
now = "{hh}:{mm}, {weekday}, {day} {month} {year}"
fire_at = "{hh}:{mm}, {weekday_short}, {day} {month_short}"
learned_at = "{day} {month_short} {hh}:{mm}"

[replies]
time_now = "сейчас {time}"
self_meta = """я бендер — твой робот, v0.2. работаю только на этой машине; твои слова живут в зашифрованной ячейке здесь, каждое пересечение границы записано в журнале, и всё, что я утверждаю о сделанном, подкреплено квитанцией. умею говорить время, вести напоминания и запоминать факты — каждый с источником, в реестре, который можно поправить и по-настоящему стереть."""
help = """вот что работает сейчас:
- время и дата
- напоминания — «напомни через 10 минут размяться», «напомни в 18:30 позвонить марку»
- «мои напоминания» / «отмени напоминание»
- память — «запомни что я пью зелёный чай», «что ты помнишь о чае»
- реестр — «мои факты» (каждый факт и его источник), «забудь факт 2», «исправь факт 1: ...»
- поиск — «найди в интернете погоду в порту»
- «кто ты» — обо мне"""
reminder_created = "готово — напомню {when}: {about}"
reminder_list_header = "твои напоминания:"
reminder_list_empty = "активных напоминаний нет."
reminder_cancelled = "отменено: {about}"
reminder_nothing_to_cancel = "нечего отменять — активных напоминаний нет."
remembered = "запомнил: {content}"
remembered_note = "(источник сохранён — смотри реестр; «забудь факт N» удаляет по-настоящему)"
recall_header = "вот что я помню:"
recall_empty = "пока ничего не запомнил — скажи «запомни ...», и я сохраню это вместе с источником."
registry_header = "реестр — каждый факт и его источник:"
registry_empty = "реестр пуст — о тебе ничего не сохранено."
registry_note = "(«забудь факт N» удаляет по-настоящему; «исправь факт N: ...» заменяет)"
registry_line = "{n}. {fact} — из твоих слов: «{source}» ({when})"
forgotten = "забыто по-настоящему: {content} — запись удалена, а не спрятана."
forget_missing = "нет факта №{n}, чтобы забыть."
corrected = "исправлено: «{old}» -> «{new}» (старый факт сохранён как устаревший — история остаётся видимой)"
correct_missing = "нет факта №{n}, чтобы исправить."
learned_at = "(запомнено {when})"
reminder_fired = "⏰ напоминание: {about}"
reminder_line = "{n}. {when} — {about}"
recall_line = "{n}. {fact} (запомнено {when})"
fallback = "об этом я пока рассуждать не умею. сейчас могу сказать время и поставить, показать или отменить напоминание. скажи «помощь»."
brain_offline = "мой модельный мозг отключён (нет OPENROUTER_API_KEY в окружении). детерминированный слой работает — время, напоминания, память, реестр. скажи «помощь»."
provider_failure = "сейчас мне трудно думать ({error}). детерминированный слой всё ещё работает — скажи «помощь»."
ultra_quota_note = "\n\n(дневной лимит ultra исчерпан — ответил на super; это указано в квитанции.)"
search_offline = "поиск в интернете выключен (нет SERPER_API_KEY в окружении); могу отвечать только из того, что уже знаю."
search_empty = "поиск ничего не нашёл по этому запросу."
search_failed = "поиск не удался: {error}"
research_failed = "источники нашёл, но обдумать их не смог ({error})."
sources_header = "источники:"
invite_created = "одноразовая ссылка-приглашение (работает один раз, роль «участник», своя запечатанная ячейка):\n{link}"
telegram_bind_code = "код привязки телеграма: {code}\nотправь этот код своему боту в телеграме в течение 10 минут, и этот чат станет твоим. (боту нужен TELEGRAM_BOT_TOKEN в окружении.)"
owner_only = "это может только владелец ({what})."
not_available_here = "это здесь недоступно ({what})."
done = "готово."
partial_note = "(часть не удалась — честные подробности в квитанции.)"
failed_generic = "не получилось — ничего не изменено. квитанция честно фиксирует сбой."
failed_note = "(ничего не изменено; в квитанции это записано как {status}.)"
unsupported_note = "[примечание от моих собственных проверок: фраза выше звучит так, будто я что-то изменил, но в этом ходе не выполнено ни одного действия — ничего не создано, не сохранено и не удалено. квитанция этого хода не фиксирует никакого эффекта.]"
