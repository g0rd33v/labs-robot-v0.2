# English language pack -- the CANONICAL one.
#
# Every other pack maps its surface phrases onto the same command ids that
# appear here. The kernel knows only these ids; it never contains a phrase
# in any language, including this one.
#
# Adding a language = adding a file like this. No kernel change, ever.

code = "en"
name = "English"
# Unicode scripts that suggest this language. Latin is claimed by en as the
# fallback; packs for Latin-script languages are chosen by phrase match, not
# by script.
scripts = ["Latin"]

# Openers that route to chitchat rather than to any capability.
greetings = ["hi", "hello", "hey", "yo", "good morning", "good evening"]

# Phrases that assert an effect (sec 5 / Q26). Every pack MUST carry these:
# a language whose effect-claims are missing is a language in which the
# Robot could claim to have acted without a receipt and go unchecked.
effect_claims = [
    "i've set", "i have set", "i've created", "i have created",
    "i've added", "i have added", "i've saved", "i have saved",
    "i've stored", "i have stored", "i've deleted", "i have deleted",
    "i've removed", "i have removed", "i've cancelled", "i've canceled",
    "i've scheduled", "i have scheduled", "i've remembered",
    "i have remembered", "i've sent", "i have sent", "reminder is set",
]

# ---------------------------------------------------------------------
# Whole-utterance commands. Matched EXACTLY, never as substrings: an
# utterance that merely contains one of these is not that command.
# ---------------------------------------------------------------------
[commands]
time_now = [
    "time", "what time is it", "what time is it now", "what's the time",
    "whats the time", "current time", "what day is it", "what day is it today",
    "what date is it",
]
self_meta = [
    "who are you", "what are you", "tell me about yourself",
]
help = ["help", "/help", "commands", "/start"]
list_reminders = [
    "reminders", "my reminders", "list reminders", "show reminders",
    "show my reminders",
]
cancel_reminder = [
    "cancel reminder", "cancel the reminder", "cancel last reminder",
    "cancel the last reminder",
]
registry_list = [
    "registry", "my facts", "show facts", "show my facts", "list facts",
]
invite = ["invite", "new invite", "invite someone"]
telegram_code = ["telegram code", "telegram"]

# ---------------------------------------------------------------------
# Structured commands: an explicit head at the start of the utterance,
# followed by an argument. `skip` is how many whitespace tokens the head
# occupies.
# ---------------------------------------------------------------------
[[heads.remember]]
phrase = "remember that"
skip = 2
[[heads.remember]]
phrase = "remember"
skip = 1

[[heads.recall]]
phrase = "what do you remember about"
skip = 5
[[heads.recall]]
phrase = "what do you remember"
skip = 4
[[heads.recall]]
phrase = "do you remember"
skip = 3

[[heads.remind]]
phrase = "remind me"
skip = 2
[[heads.remind]]
phrase = "remind"
skip = 1

[[heads.forget_fact]]
phrase = "forget fact"
skip = 2

[[heads.correct_fact]]
phrase = "correct fact"
skip = 2

[[heads.web_search]]
phrase = "search the web for"
skip = 4
[[heads.web_search]]
phrase = "search the web"
skip = 3
[[heads.web_search]]
phrase = "search online for"
skip = 3
[[heads.web_search]]
phrase = "search for"
skip = 2
[[heads.web_search]]
phrase = "look up"
skip = 2
[[heads.web_search]]
phrase = "google"
skip = 1

# ---------------------------------------------------------------------
# Grammar particles used by the structured parsers.
# ---------------------------------------------------------------------
# Handling cues, matched across all languages (see `matches_signal`).
[signals]
escalate_ultra = ["think ultra", "maximum effort"]
escalate_super = ["```", "think hard", "step by step", "prove", "theorem"]

[particles]
# dropped right after a head: "remind me to call mark" -> "call mark"
filler = ["to", "that", "about", "for"]
# "remind me IN 10 minutes"
relative = ["in"]
# "remind me AT 18:30"
absolute = ["at"]
tomorrow = ["tomorrow"]
minutes = ["minute", "minutes", "min", "mins"]
hours = ["hour", "hours", "h"]

# ---------------------------------------------------------------------
# Calendar vocabulary (Monday first, January first) and datetime layouts.
# This is why a date can be spoken in the person's language without a
# locale library: twelve words and seven words per pack.
# ---------------------------------------------------------------------
[calendar]
weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
weekdays_short = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
months = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December",
]
months_short = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
]

[formats]
now = "{hh}:{mm} on {weekday}, {day} {month} {year}"
fire_at = "{hh}:{mm} on {weekday_short}, {day} {month_short}"
learned_at = "{day} {month_short} {hh}:{mm}"

# ---------------------------------------------------------------------
# Everything the Robot says on the deterministic path. Rendered in the
# person's language WITHOUT a model call, so the floor stays offline.
# {placeholders} are filled by the kernel.
# ---------------------------------------------------------------------
[replies]
time_now = "it's {time}"
self_meta = """i'm bender -- your robot, v0.2. i run on this machine only; your words live in an encrypted cell here, every crossing is in the boundary log, and everything i claim to have done carries a receipt. i can tell time, keep reminders, and remember facts you tell me -- every fact with its source, listed in my registry, correctable and deletable for real."""
help = """here's what works today:
- time / date
- reminders -- "remind me in 10 minutes to stretch", "remind me at 18:30 to call mark"
- "my reminders" / "cancel reminder"
- memory -- "remember that i drink green tea", "what do you remember about tea"
- registry -- "my facts" (every fact + its source), "forget fact 2", "correct fact 1: ..."
- search -- "look up the weather in porto"
- "who are you" -- about me"""
reminder_created = "done -- i'll remind you at {when}: {about}"
reminder_list_header = "your reminders:"
reminder_list_empty = "no active reminders."
reminder_cancelled = "cancelled: {about}"
reminder_nothing_to_cancel = "nothing to cancel -- no active reminders."
remembered = "remembered: {content}"
remembered_note = "(source kept -- see your registry; \"forget fact N\" deletes for real)"
recall_header = "here's what i remember:"
recall_empty = "nothing in memory yet -- tell me \"remember ...\" and i'll keep it, with its source."
registry_header = "registry -- every fact and its source:"
registry_empty = "registry is empty -- no facts stored about you."
registry_note = "(\"forget fact N\" deletes for real; \"correct fact N: ...\" supersedes)"
registry_line = "{n}. {fact} -- from your words: \"{source}\" ({when})"
forgotten = "forgotten for real: {content} -- the row is deleted, not hidden."
forget_missing = "no fact #{n} to forget."
corrected = "corrected: \"{old}\" -> \"{new}\" (the old fact is kept as superseded -- history stays inspectable)"
correct_missing = "no fact #{n} to correct."
learned_at = "(learned {when})"
reminder_fired = "⏰ reminder: {about}"
reminder_line = "{n}. {when} -- {about}"
recall_line = "{n}. {fact} (learned {when})"
fallback = "i can't reason about that yet. today i can tell the time, and set, list, or cancel reminders. try \"help\"."
brain_offline = "my model brain is offline (no OPENROUTER_API_KEY in the environment). the deterministic floor still works -- time, reminders, memory, registry. try \"help\"."
provider_failure = "i'm having trouble thinking right now ({error}). the deterministic floor still works -- try \"help\"."
ultra_quota_note = "\n\n(daily ultra budget exhausted -- answered on super; the receipt names it.)"
search_offline = "web search is off (no SERPER_API_KEY in the environment); i can only answer from what i already know."
search_empty = "the web search came back empty for that."
search_failed = "the web search failed: {error}"
research_failed = "i found sources but couldn't think about them ({error})."
sources_header = "sources:"
invite_created = "one-time invite link (works once, member role, their own sealed cell):\n{link}"
telegram_bind_code = "telegram bind code: {code}\nsend this code to your bot in telegram within 10 minutes and that chat becomes yours. (the bot needs TELEGRAM_BOT_TOKEN in the environment.)"
owner_only = "only the owner can do that ({what})."
not_available_here = "that isn't available in this context ({what})."
done = "done."
partial_note = "(some of that failed -- the receipt has the honest detail.)"
failed_generic = "that didn't work -- nothing was changed. the receipt records the failure honestly."
failed_note = "(nothing was changed; the receipt records this as {status}.)"
unsupported_note = "[note from my own checks: the sentence above sounds like i changed something, but this turn executed no action -- nothing was created, saved, or deleted. the receipt for this turn records no effect.]"
