<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bender</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid #21262d;
    font-weight: 600; letter-spacing: .04em; color: #7ee787;
  }
  header small { color: #8b949e; font-weight: 400; margin-left: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 72ch; margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
  .you   { background: #1f6feb22; border: 1px solid #1f6feb55; margin-left: auto; }
  .robot { background: #16191f;   border: 1px solid #21262d; }
  .who { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; }
  input {
    flex: 1; background: #010409; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 12px; font: inherit; outline: none;
  }
  input:focus { border-color: #1f6feb; }
  button {
    background: #238636; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>bender<small>robot v0.2 &middot; M1 skeleton</small></header>
<div id="log"></div>
<form id="f">
  <input id="t" autocomplete="off" placeholder="say something to your robot" autofocus>
  <button id="b">send</button>
</form>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('t');
  const btn = document.getElementById('b');

  function add(who, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = who === 'you' ? 'you' : 'bender';
    const b = document.createElement('div');
    b.textContent = text;
    d.append(w, b);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    add('you', text);
    btn.disabled = true;
    try {
      const r = await fetch('/api/message', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) { add('robot', '[error ' + r.status + ']'); return; }
      const j = await r.json();
      add('robot', j.reply);
    } catch (err) {
      add('robot', '[unreachable: ' + err + ']');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  };
</script>
</body>
</html>
