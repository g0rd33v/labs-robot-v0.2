<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bender</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid #21262d;
    font-weight: 600; letter-spacing: .04em; color: #7ee787;
  }
  header small { color: #8b949e; font-weight: 400; margin-left: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 72ch; margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: break-word; }
  .in    { background: #1f6feb22; border: 1px solid #1f6feb55; margin-left: auto; }
  .out   { background: #16191f;   border: 1px solid #21262d; }
  .who { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; }
  input {
    flex: 1; background: #010409; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 12px; font: inherit; outline: none;
  }
  input:focus { border-color: #1f6feb; }
  button {
    background: #238636; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  #thinking { display: none; color: #8b949e; font-size: 12px; padding: 0 16px 6px; }
</style>
</head>
<body>
<header>bender<small>robot v0.2</small></header>
<div id="log"></div>
<div id="thinking">thinking&hellip;</div>
<form id="f">
  <input id="t" autocomplete="off" placeholder="say something to your robot" autofocus>
  <button id="b">send</button>
</form>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('t');
  const btn = document.getElementById('b');
  const thinking = document.getElementById('thinking');
  let lastTs = 0;
  const seen = new Set();

  function render(row) {
    const key = row.ts + '|' + row.direction + '|' + row.content;
    if (seen.has(key)) return;
    seen.add(key);
    if (row.ts > lastTs) lastTs = row.ts;
    const d = document.createElement('div');
    d.className = 'msg ' + (row.direction === 'in' ? 'in' : 'out');
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = row.direction === 'in' ? 'you' : 'bender';
    const b = document.createElement('div');
    b.textContent = row.content;
    d.append(w, b);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function poll() {
    try {
      const r = await fetch('/api/history?after=' + lastTs);
      if (!r.ok) return;
      const rows = await r.json();
      rows.forEach(render);
    } catch (_) { /* robot restarting; next poll catches up */ }
  }

  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    btn.disabled = true;
    thinking.style.display = 'block';
    try {
      const r = await fetch('/api/message', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) render({ ts: lastTs, direction: 'out', content: '[error ' + r.status + ']' });
      await poll(); // server truth renders both sides
    } catch (err) {
      render({ ts: lastTs, direction: 'out', content: '[unreachable: ' + err + ']' });
    } finally {
      btn.disabled = false;
      thinking.style.display = 'none';
      input.focus();
    }
  };

  poll();                 // history on load
  setInterval(poll, 4000); // and the scheduler's reminders arrive live
</script>
</body>
</html>
