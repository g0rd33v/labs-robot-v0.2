<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bender</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid #21262d;
    font-weight: 600; letter-spacing: .04em; color: #7ee787;
  }
  header small { color: #8b949e; font-weight: 400; margin-left: 8px; }
  header a { color: #58a6ff; float: right; text-decoration: none; font-weight: 400; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 72ch; margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: break-word; }
  .in    { background: #1f6feb22; border: 1px solid #1f6feb55; margin-left: auto; }
  .out   { background: #16191f;   border: 1px solid #21262d; }
  .who { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; }
  input[type=text] {
    flex: 1; background: #010409; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 12px; font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: #1f6feb; }
  button, label.up {
    background: #238636; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; cursor: pointer;
  }
  label.up { background: #21262d; padding: 10px 14px; }
  button:disabled { opacity: .5; }
  #thinking { display: none; color: #8b949e; font-size: 12px; padding: 0 16px 6px; }
  .receipt { background:transparent; border:1px solid #30363d; color:#8b949e;
             font-size:11px; padding:2px 8px; border-radius:6px; cursor:pointer;
             margin-top:7px; }
  .receipt:hover { color:#e6edf3; border-color:#58a6ff; }
  #modal { display:none; position:fixed; inset:0; background:#000a; z-index:50;
           align-items:center; justify-content:center; padding:20px; }
  #modal-box { background:#161b22; border:1px solid #30363d; border-radius:12px;
               padding:18px 20px; max-width:640px; width:100%; max-height:80vh;
               overflow:auto; }
  #modal h3 { margin:0 0 4px; font-size:14px; }
  #modal-box { position:relative; }
  #modal-close { position:absolute; top:10px; right:12px; background:transparent;
                 border:0; color:#8b949e; font-size:20px; line-height:1;
                 cursor:pointer; padding:2px 6px; border-radius:6px; }
  #modal-close:hover { color:#e6edf3; }
  .rc-status { display:inline-block; font-size:11px; text-transform:uppercase;
               letter-spacing:.08em; padding:2px 9px; border-radius:5px; margin-bottom:10px; }
  .rc-status.ok { background:#1a7f3722; color:#7ee787; }
  .rc-status.warn { background:#d2992222; color:#d29922; }
  .rc-claim { border-left:2px solid #30363d; padding:6px 0 6px 11px; margin:9px 0; }
  .rc-ev { color:#8b949e; font-size:12.5px; margin-top:3px; }
  .approval { background:#161b22; border:1px solid #d2992255; border-radius:10px;
              padding:13px 15px; margin:10px 0; }
  .ap-title { color:#d29922; font-size:12px; text-transform:uppercase;
              letter-spacing:.07em; }
  .ap-what { margin:7px 0 11px; }
  .ap-what code { background:#0d1117; border:1px solid #21262d; border-radius:5px;
                  padding:1px 6px; font-size:13px; }
  .ap-args { color:#8b949e; font-size:13px; margin-top:5px; }
  .ap-bar button { border:1px solid #30363d; background:#21262d; color:#e6edf3;
                   padding:6px 15px; border-radius:7px; cursor:pointer; margin-right:7px; }
  .ap-bar button.ok { border-color:#238636; color:#7ee787; }
  .ap-bar button.no { border-color:#5c2a26; color:#f85149; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline:2px solid #58a6ff; outline-offset:2px; }
</style>
</head>
<body>
<header>bender<small>robot v0.2</small><a href="__PREFIX__/dash">dashboard</a><a href="__PREFIX__/me" style="margin-right:14px">my data</a></header>
<div id="log"></div>
<div id="thinking">thinking&hellip;</div>
<form id="f">
  <label class="up" title="voice note or file">&#128206;<input id="file" type="file" hidden></label>
  <input id="t" type="text" autocomplete="off" placeholder="say something to your robot" autofocus>
  <button id="b">send</button>
</form>
<div id="modal" role="dialog" aria-modal="true" aria-label="receipt">
  <div id="modal-box"><button id="modal-close" aria-label="close receipt">&times;</button>
  <h3>receipt &mdash; what this reply actually did</h3>
  <div id="modal-body"></div></div>
</div>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('t');
  const btn = document.getElementById('b');
  const fileInput = document.getElementById('file');
  const thinking = document.getElementById('thinking');
  let lastTs = 0;
  const seen = new Set();

  function render(row) {
    const key = row.ts + '|' + row.direction + '|' + row.content;
    if (seen.has(key)) return;
    seen.add(key);
    if (row.ts > lastTs) lastTs = row.ts;
    const d = document.createElement('div');
    d.className = 'msg ' + (row.direction === 'in' ? 'in' : 'out');
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = row.direction === 'in' ? 'you' : 'bender';
    const b = document.createElement('div');
    b.textContent = row.content;
    d.append(w, b);
    // spec 4.1.4: the receipts law, made visible. Every reply that came
    // from a turn can show what it actually did and the evidence behind
    // each claim -- otherwise "evidence-grade" is a word in a document.
    if (row.intent) {
      const r = document.createElement('button');
      r.className = 'receipt';
      r.textContent = 'receipt';
      r.title = 'what this reply actually did, and the evidence for it';
      r.onclick = () => showReceipt(row.intent);
      d.appendChild(r);
    }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function poll() {
    try {
      const r = await fetch('__PREFIX__/api/history?after=' + lastTs);
      if (!r.ok) return;
      const rows = await r.json();
      if (rows.some(x => x.direction === 'out')) clearDraft();
      rows.forEach(render);
    } catch (_) { /* robot restarting; next event catches up */ }
  }

  // the streaming draft: the answer being born, before its canonical
  // message lands through history. display-only.
  let draftEl = null;
  function showDraft(text) {
    if (!draftEl) {
      draftEl = document.createElement('div');
      draftEl.className = 'msg out';
      const w = document.createElement('div');
      w.className = 'who';
      w.textContent = 'bender';
      const b = document.createElement('div');
      b.className = 'draft-body';
      draftEl.append(w, b);
      log.appendChild(draftEl);
    }
    draftEl.querySelector('.draft-body').textContent = text + ' \u258c';
    log.scrollTop = log.scrollHeight;
  }
  function clearDraft() {
    if (draftEl) { draftEl.remove(); draftEl = null; }
  }

  function busy(on) {
    btn.disabled = on;
    thinking.style.display = on ? 'block' : 'none';
  }

  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    busy(true);
    try {
      const r = await fetch('__PREFIX__/api/message', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) render({ ts: lastTs, direction: 'out', content: '[error ' + r.status + ']' });
      await poll();
    } catch (err) {
      render({ ts: lastTs, direction: 'out', content: '[unreachable: ' + err + ']' });
    } finally {
      busy(false);
      input.focus();
    }
  };

  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    busy(true);
    try {
      const r = await fetch('__PREFIX__/api/upload', {
        method: 'POST',
        headers: { 'x-filename': encodeURIComponent(file.name) },
        body: file,
      });
      if (!r.ok) render({ ts: lastTs, direction: 'out', content: '[upload error ' + r.status + ']' });
      await poll();
    } finally {
      busy(false);
      fileInput.value = '';
    }
  };

  // ---- the receipt inspector (spec 4.1.4) ----
  async function showReceipt(intent) {
    const box = document.getElementById('modal');
    const body = document.getElementById('modal-body');
    body.textContent = 'reading the journal…';
    box.style.display = 'flex';
    try {
      const r = await fetch('__PREFIX__/api/receipt/' + encodeURIComponent(intent));
      if (!r.ok) { body.textContent = 'no receipt for that turn.'; return; }
      const j = await r.json();
      body.innerHTML = '';
      const h = document.createElement('div');
      h.className = 'rc-status ' + (j.status === 'verified' ? 'ok' : 'warn');
      h.textContent = j.status;
      body.appendChild(h);
      (j.claims || []).forEach(c => {
        const box2 = document.createElement('div');
        box2.className = 'rc-claim';
        const t = document.createElement('div');
        t.textContent = c.claim;
        box2.appendChild(t);
        (c.evidence || []).forEach(e => {
          const ev = document.createElement('div');
          ev.className = 'rc-ev';
          ev.textContent = '· ' + e.kind + (e.provider ? ' / ' + e.provider : '') +
                           (e.external_id ? ' → ' + e.external_id : '');
          box2.appendChild(ev);
        });
        if (!(c.evidence || []).length) {
          const ev = document.createElement('div');
          ev.className = 'rc-ev';
          ev.textContent = '· no evidence — this asserts nothing about the world';
          box2.appendChild(ev);
        }
        body.appendChild(box2);
      });
      const foot = document.createElement('div');
      foot.className = 'rc-ev';
      const models = (j.models || []).join(', ');
      foot.textContent = (models ? 'models: ' + models : 'no model spoke') +
        ((j.disclosures || []).length ? ' · disclosed: ' + j.disclosures.join(', ') : '');
      body.appendChild(foot);
    } catch (e) {
      body.textContent = 'could not read the receipt: ' + e;
    }
  }
  // guarded: this used to be a bare getElementById whose null took the
  // whole script down with it -- and everything after it, including the
  // history poll, so the chat rendered EMPTY. A decoration must never be
  // able to cost the page its content.
  const modalEl = document.getElementById('modal');
  if (modalEl) {
    // clicking the backdrop works, but only with a mouse; a keyboard user
    // needs something focusable to reach
    document.getElementById('modal-close').onclick = () => {
      modalEl.style.display = 'none';
    };
    modalEl.onclick = (e) => {
      if (e.target.id === 'modal') e.target.style.display = 'none';
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modalEl.style.display = 'none';
    });
  }

  // ---- approval cards (spec 4.1.4): buttons over the durable gate ----
  let approvalsDrawn = new Set();
  async function loadApprovals() {
    try {
      const r = await fetch('__PREFIX__/api/approvals');
      if (!r.ok) return;
      const list = await r.json();
      const live = new Set(list.map(a => a.intent));
      // an approval answered elsewhere leaves the screen
      document.querySelectorAll('.approval').forEach(el => {
        if (!live.has(el.dataset.intent)) { el.remove(); approvalsDrawn.delete(el.dataset.intent); }
      });
      list.forEach(a => {
        if (approvalsDrawn.has(a.intent)) return;
        approvalsDrawn.add(a.intent);
        const card = document.createElement('div');
        card.className = 'approval';
        card.dataset.intent = a.intent;
        const t = document.createElement('div');
        t.className = 'ap-title';
        t.textContent = 'needs your say-so';
        const what = document.createElement('div');
        what.className = 'ap-what';
        const g = a.args || {};
        // a card that asks for consent has to say what it is asking about.
        // Raw JSON is not a description -- someone approving a send should
        // read the recipient, not parse an object.
        if (a.capability === 'email.send') {
          what.textContent = 'Send an email to ' + (g.to || 'an unnamed address') +
            (g.subject ? ' — “' + g.subject + '”' : '');
        } else {
          const args = Object.entries(g)
            .map(([k, v]) => k + ': ' + (typeof v === 'string' ? v : JSON.stringify(v)));
          const name = document.createElement('code');
          name.textContent = a.capability;
          what.textContent = '';
          what.append('Run ', name);
          if (args.length) {
            const detail = document.createElement('div');
            detail.className = 'ap-args';
            detail.textContent = args.join(' · ');
            what.appendChild(detail);
          }
        }
        const bar = document.createElement('div');
        bar.className = 'ap-bar';
        const mk = (label, approved, cls) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (cls) b.className = cls;
          b.onclick = async () => {
            bar.querySelectorAll('button').forEach(x => x.disabled = true);
            const res = await fetch('__PREFIX__/api/approvals/' + encodeURIComponent(a.intent), {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ approved }),
            });
            if (!res.ok) { t.textContent = 'that approval is no longer open'; }
            card.remove(); approvalsDrawn.delete(a.intent);
            poll(); loadApprovals();
          };
          bar.appendChild(b);
        };
        mk('Approve', true, 'ok');
        mk('Deny', false, 'no');
        card.append(t, what, bar);
        log.appendChild(card);
        log.scrollTop = log.scrollHeight;
      });
    } catch (_) {}
  }

  // SSE push: replies and scheduler fires arrive the moment they exist;
  // a slow poll stays on as the fallback when the stream reconnects.
  try {
    const es = new EventSource('__PREFIX__/api/stream');
    es.onmessage = (e) => {
      // 'resync' means the server dropped events for this client; refetch
      // everything rather than sit silently stale
      if (e.data === 'resync') { lastTs = 0; seen.clear(); log.innerHTML = ''; draftEl = null; }
      poll();
      loadApprovals();
    };
    es.addEventListener('draft', (e) => {
      try { showDraft(JSON.parse(e.data)); } catch (_) {}
    });
  } catch (_) {}
  poll();
  loadApprovals();
  setInterval(() => { poll(); loadApprovals(); }, 15000);
</script>
</body>
</html>
